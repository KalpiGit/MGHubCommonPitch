<!doctype html>
<html><head><meta charset="utf-8"><title>Partner wall variants</title>
<link rel="stylesheet" href="deck.css?v=48">
<style>
body{overflow:auto;background:#ECEEEA;padding:34px 40px}
#deck{display:none}
.vlabel{font-size:13px;font-weight:800;letter-spacing:.22em;color:#8A97AC;margin:0 0 12px 4px;text-transform:uppercase}
.vlabel b{color:#3E8BEB}
.variant{background:#F7F7F3;border-radius:18px;padding:34px 40px 38px;margin-bottom:44px;
  box-shadow:0 2px 6px rgba(16,30,60,.06)}
.head{margin-bottom:14px}
.head .eyebrow{margin-bottom:6px}
.head h2{font-size:34px}

/* shared wall geometry */
.wall{position:relative;border-radius:24px}
.wgrid{display:grid;height:196px;grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));column-gap:34px;row-gap:12px;
  justify-items:stretch;align-items:stretch}
.cell{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:2px 8px;position:relative}
.plg{display:block;flex:1;max-width:150px;height:34px;background:#F4F8FF;
  -webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat}
.plg-sm{max-width:21px;height:21px}
.wtxt{font-size:16px;font-weight:800;letter-spacing:-.01em;color:#F4F8FF;white-space:nowrap}
.youx{border:1.5px dashed rgba(143,184,255,.4);border-radius:15px;margin:2px 4px;
  font-size:14px;font-weight:700;letter-spacing:.05em;color:rgba(214,231,255,.85)}
.tag{display:block;text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-top:5px}

/* V1 current navy slab */
.v1 .wall{padding:24px 34px;background:linear-gradient(165deg,#16294D,#0D1C36 55%,#0A1730);
  box-shadow:0 34px 64px -38px rgba(7,20,37,.75),inset 0 1px 0 rgba(255,255,255,.07)}
.v1 .tag{color:rgba(143,184,255,.55)}

/* V2 navy + hairline cells (editorial) */
.v2 .wall{padding:0;background:linear-gradient(165deg,#152A50,#0B1932);overflow:hidden;
  box-shadow:0 34px 64px -38px rgba(7,20,37,.75)}
.v2 .wgrid{height:auto;row-gap:0;column-gap:0}
.v2 .cell{height:64px;border-right:1px solid rgba(143,184,255,.12);border-bottom:1px solid rgba(143,184,255,.12)}
.v2 .cell:nth-child(4n){border-right:0}
.v2 .cell:nth-last-child(-n+3){border-bottom:0}
.v2 .youx{border:0;border-radius:0;margin:0;background:rgba(143,184,255,.06)}

/* V3 floating white tiles + role tags */
.v3 .wall{background:transparent}
.v3 .cell{background:#fff;border:1px solid rgba(18,34,63,.09);border-radius:15px;
  flex-direction:column;gap:2px;box-shadow:0 14px 30px -24px rgba(18,34,63,.5);
  transition:transform .3s,box-shadow .3s}
.v3 .cell:hover{transform:translateY(-4px);box-shadow:0 22px 40px -26px rgba(18,34,63,.6)}
.v3 .plg{background:#12223F;max-width:120px;height:26px}
.v3 .wtxt{color:#12223F;font-size:15px}
.v3 .tag{color:#8A97AC}
.v3 .youx{border:1.5px dashed rgba(75,142,242,.5);background:rgba(75,142,242,.05);color:#4B8EF2;box-shadow:none}

/* V4 navy slab, metallic sheen */
.v4 .wall{padding:24px 34px;background:linear-gradient(165deg,#1A2F55,#0C1A34);
  box-shadow:0 34px 64px -38px rgba(7,20,37,.8)}
.v4 .plg{background:linear-gradient(180deg,#FFFFFF 0%,#C9D6EA 38%,#8FA3C2 55%,#E4ECF7 72%,#B7C6DD 100%)}
.v4 .wtxt{background:linear-gradient(180deg,#FFFFFF,#C9D6EA 45%,#8FA3C2 60%,#E4ECF7);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.v4 .youx{border-color:rgba(200,215,240,.35)}

/* V5 split: light slab + navy logo band */
.v5 .wall{padding:20px 30px;background:#fff;border:1px solid rgba(18,34,63,.1);
  box-shadow:0 26px 52px -36px rgba(18,34,63,.5)}
.v5 .plg{background:#12223F}
.v5 .wtxt{color:#12223F}
.v5 .tag{color:#8A97AC}
.v5 .youx{border:1.5px dashed rgba(75,142,242,.45);color:#4B8EF2;background:rgba(75,142,242,.04)}
</style>
</head><body>
<main id="deck"><section class="slide"><div id="h"></div></section></main>

<div id="variants"></div>

<script src="data.js?v=48"></script>
<script>
const D=window.MG;
const AREAS=['1/1','1/2','1/3','1/4','2/1','2/2','2/3','2/4','3/1','3/4'];
const TAGS={Cognition:'Chapter IX partner','NGC':'Chapter VIII partner','Google Cloud':'Chapter VIII host',
  Appcircle:'Chapter II partner',Couchbase:'Chapter V partner',Testinium:'Chapter I partner',
  Oobeya:'Chapter I partner',Melek:'Chapter IV partner','MG Works':'In-house production',MotoX:'Chapter VI partner'};
const cell=(p,i,tagged)=>{
  const visual=p.src?`<span class="plg" style="--img:url('${p.src}')"></span>`
    :`${p.icon?`<span class="plg plg-sm" style="--img:url('${p.icon}')"></span>`:''}<span class="wtxt">${p.text}</span>`;
  const tag=tagged&&TAGS[p.n]?`<span class="tag">${TAGS[p.n]}</span>`:'';
  return `<div class="cell" style="grid-area:${AREAS[i]}"><div style="display:flex;flex-direction:column;align-items:center;width:100%">
    <div style="display:flex;align-items:center;justify-content:center;gap:9px;width:100%">${visual}</div>${tag}</div></div>`;
};
const build=(tagged)=>D.partners.map((p,i)=>cell(p,i,tagged)).join('')+
  `<div class="cell youx" style="grid-area:3/2/4/4">Your company?</div>`;

const V=[
 ['v1','Current — navy slab, flat white'],
 ['v2','Navy slab — hairline editorial cells'],
 ['v3','Light — floating tiles + role tags'],
 ['v4','Navy slab — metallic sheen logos'],
 ['v5','Light slab — navy marks + role tags'],
];
document.getElementById('variants').innerHTML=V.map(([c,t],i)=>`
  <p class="vlabel"><b>${c.toUpperCase()}</b> · ${t}</p>
  <div class="variant ${c}">
    <div class="head"><p class="eyebrow">Brands that have shared the room with our community</p>
    <h2>Our partners, <em>in good company.</em></h2></div>
    <div class="wall"><div class="wgrid">${build(i===2||i===4)}</div></div>
  </div>`).join('');
</script>
</body></html>
